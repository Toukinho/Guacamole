spring.application.name=backend
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/Spring/.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/guacamole}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

security.token.expiration-seconds=${TOKEN_EXPIRATION_SECONDS:43200}
